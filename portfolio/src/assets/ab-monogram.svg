<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#231e1c"/>
      <stop offset="60%" stop-color="#151312"/>
      <stop offset="100%" stop-color="#0d0c0c"/>
    </radialGradient>

    <!-- Warm Orange Monogram Gradient -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8e53"/>
      <stop offset="50%" stop-color="#f46c38"/>
      <stop offset="100%" stop-color="#d44b19"/>
    </linearGradient>

    <!-- Lime Accent Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5ff41"/>
      <stop offset="100%" stop-color="#9ee01b"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Card Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.06)" />
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect width="600" height="600" rx="36" fill="url(#bgGlow)"/>
  
  <!-- Subtle Dot Grid Overlay -->
  <rect width="600" height="600" rx="36" fill="url(#dotGrid)"/>

  <!-- Delicate Border -->
  <rect x="1.5" y="1.5" width="597" height="597" rx="34.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Concentric Geometric Target Rings (Subtle Editorial Touch) -->
  <circle cx="300" cy="270" r="180" fill="none" stroke="rgba(244, 108, 56, 0.08)" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="300" cy="270" r="230" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>

  <!-- Ambient Glow Behind Letters -->
  <circle cx="300" cy="270" r="100" fill="#f46c38" opacity="0.18" filter="url(#orangeGlow)"/>

  <!-- THE INTERLOCKING "AB" MONOGRAM ICON -->
  <g transform="translate(145, 115) scale(1.05)" filter="url(#softShadow)">
    
    <!-- Letter A: Bold Left Diagonal and Apex -->
    <path d="M 65 300 L 140 30 L 195 30 L 260 300 L 205 300 L 190 235 L 105 235 L 90 300 Z M 115 185 L 180 185 L 148 65 Z" 
          fill="url(#monogramGrad)" />

    <!-- A-Crossbar Accent Bar in High-Voltage Volt Lime -->
    <rect x="105" y="195" width="85" height="10" rx="5" fill="url(#limeGrad)" />

    <!-- Letter B: Shared Spine with A, Two Continuous Aerodynamic Bows -->
    <path d="M 195 30 L 270 30 C 320 30 350 55 350 95 C 350 125 330 145 295 155 C 340 165 365 190 365 235 C 365 280 325 300 270 300 L 195 300 L 210 245 L 265 245 C 295 245 315 235 315 210 C 315 185 295 175 260 175 L 225 175 L 240 120 L 265 120 C 290 120 305 110 305 90 C 305 70 290 60 265 60 L 202 60 Z" 
          fill="url(#monogramGrad)" opacity="0.95" />

    <!-- Negative Space Detail Cuts / Future Tech Notches -->
    <circle cx="148" cy="115" r="5" fill="#151312" />
  </g>

  <!-- Bottom Glassmorphic Label Pill -->
  <g transform="translate(150, 490)">
    <!-- Pill Background -->
    <rect width="300" height="52" rx="26" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Status Indicator Dot (Lime) -->
    <circle cx="34" cy="26" r="5" fill="#c5ff41"/>
    <circle cx="34" cy="26" r="9" fill="none" stroke="#c5ff41" stroke-width="1.5" opacity="0.5"/>

    <!-- Text -->
    <text x="56" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="2">
      AASHISH BHAMBRI
    </text>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 36 60 L 36 36 L 60 36" fill="none" stroke="rgba(244, 108, 56, 0.4)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 540 36 L 564 36 L 564 60" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 36 540 L 36 564 L 60 564" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 540 564 L 564 564 L 564 540" fill="none" stroke="rgba(244, 108, 56, 0.4)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
