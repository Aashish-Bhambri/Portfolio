<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="favBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#231e1c"/>
      <stop offset="65%" stop-color="#151312"/>
      <stop offset="100%" stop-color="#0b0a0a"/>
    </radialGradient>

    <!-- Warm Orange Monogram Gradient -->
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9359"/>
      <stop offset="50%" stop-color="#f46c38"/>
      <stop offset="100%" stop-color="#d44b19"/>
    </linearGradient>

    <!-- High-Voltage Volt Lime Gradient -->
    <linearGradient id="favLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5ff41"/>
      <stop offset="100%" stop-color="#a8f020"/>
    </linearGradient>

    <!-- Ambient Radial Glow Filter -->
    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Depth Shadow -->
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Base for App Icon / Favicon -->
  <rect width="512" height="512" rx="112" fill="url(#favBg)"/>

  <!-- Subtle Outer Border -->
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6"/>

  <!-- Subtle Concentric Tech Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(244, 108, 56, 0.12)" stroke-width="2.5" stroke-dasharray="6 10"/>

  <!-- Warm Ambient Glow Behind Letters -->
  <circle cx="256" cy="256" r="120" fill="#f46c38" opacity="0.25" filter="url(#favGlow)"/>

  <!-- THE INTERLOCKING "AB" MONOGRAM -->
  <g transform="translate(-13, 50) scale(1.25)" filter="url(#favShadow)">
    <!-- Letter A: Bold Left Diagonal, Apex and Inner Counter -->
    <path d="M 65 300 L 140 30 L 195 30 L 260 300 L 205 300 L 190 235 L 105 235 L 90 300 Z M 115 185 L 180 185 L 148 65 Z" 
          fill="url(#favOrange)" />

    <!-- A-Crossbar Accent Bar in Volt Lime -->
    <rect x="105" y="195" width="85" height="12" rx="6" fill="url(#favLime)" />

    <!-- Letter B: Shared Spine, Two Aerodynamic Bows -->
    <path d="M 195 30 L 270 30 C 320 30 350 55 350 95 C 350 125 330 145 295 155 C 340 165 365 190 365 235 C 365 280 325 300 270 300 L 195 300 L 210 245 L 265 245 C 295 245 315 235 315 210 C 315 185 295 175 260 175 L 225 175 L 240 120 L 265 120 C 290 120 305 110 305 90 C 305 70 290 60 265 60 L 202 60 Z" 
          fill="url(#favOrange)" opacity="0.96" />

    <!-- Tech Notch / Punch Hole Detail -->
    <circle cx="148" cy="115" r="5.5" fill="#151312" />
  </g>
</svg>
